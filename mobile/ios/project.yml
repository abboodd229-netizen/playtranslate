# XcodeGen spec for the iPhone/iPad app. CI runs `xcodegen generate` on macOS;
# the generated PlayTranslate.xcodeproj is not committed.
name: PlayTranslate
options:
  bundleIdPrefix: com.playtranslate
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  PlayTranslate:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../../packs/gta-vi.json
        buildPhase: resources
      # Built-in Remote Play: Pylux (open-source Chiaki fork, AGPL-3.0), fetched and patched
      # by scripts/fetch-pylux.sh. Its own app entry point, icon and plist are left out.
      - path: third_party/pylux/ios/Pylux
        excludes:
          - "App/PyluxApp.swift"
          - "Assets.xcassets"
          - "Info.plist"
          - "Pylux.entitlements"
          - "Donation/DonationProducts.storekit"
      - path: third_party/pylux/gui/res/license/agpl_license.txt
        buildPhase: resources
      - path: third_party/pylux/gui/res/license/disclaimer.txt
        buildPhase: resources
      - path: third_party/pylux/shared/donation_prompt_phrases.json
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PlayTranslate
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        NSLocalNetworkUsageDescription: "يتصل بالبلايستيشن في شبكة البيت، ويرسل الترجمة العربية إلى تطبيق PlayTranslate على التلفزيون."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        GCSupportsControllerUserInteraction: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/PlayTranslate.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.playtranslate.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playtranslate.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Chiaki C library, built by scripts/build-chiaki.sh (device only).
        SWIFT_OBJC_BRIDGING_HEADER: third_party/pylux/ios/Pylux/Bridge/ChiakiBridge.h
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/third_party/pylux/lib/include"
          - "$(SRCROOT)/third_party/pylux/ios/build-iphoneos/parent/lib/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/third_party/pylux/ios/build-iphoneos"
        OTHER_LDFLAGS:
          - "-lchiaki_complete"
          - "-lz"
          - "-framework Security"
          - "-framework Foundation"
          - "-framework CoreServices"
          - "-framework VideoToolbox"
          - "-framework AVFoundation"
          - "-framework AVKit"
          - "-framework AudioToolbox"
          - "-framework CoreMedia"
          - "-framework CoreVideo"
    dependencies:
      - target: Broadcast
  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Shared
      - path: ../../packs/gta-vi.json
        buildPhase: resources
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: PlayTranslate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.playtranslate.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playtranslate.mobile.Broadcast
  PlayTranslateTests:
    # Logic tests on the shared code only, without the app as host: the app links the
    # device-only Chiaki library, so it is never built for the simulator.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playtranslate.mobile.tests
schemes:
  PlayTranslate:
    build:
      targets:
        PlayTranslate: all
        Broadcast: all
  PlayTranslateTests:
    build:
      targets:
        PlayTranslateTests: [test]
    test:
      targets:
        - PlayTranslateTests

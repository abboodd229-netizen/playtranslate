name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a public release with this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  tv-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages (the runner already has the SDK)
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.PT_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PT_KEYSTORE_PASSWORD }}
        run: |
          # Optional secrets PT_KEYSTORE_B64 / PT_KEYSTORE_PASSWORD (alias "playtranslate") give every
          # build the same signature, so new versions install over old ones. Without them a
          # one-off key is made, and updating means uninstalling the old app first.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pt.jks"
            PW="$KEYSTORE_PASSWORD"
          else
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/pt.jks" -storepass "$PW" -keypass "$PW" \
              -alias playtranslate -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PlayTranslate"
          fi
          echo "::add-mask::$PW"
          {
            echo "PT_KEYSTORE=$RUNNER_TEMP/pt.jks"
            echo "PT_KEYSTORE_PASSWORD=$PW"
            echo "PT_KEY_ALIAS=playtranslate"
            echo "PT_KEY_PASSWORD=$PW"
          } >> "$GITHUB_ENV"
      - name: Build TV app
        working-directory: tv-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../PlayTranslateTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PlayTranslateTV-apk
          path: PlayTranslateTV.apk

  windows:
    needs: tv-apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests (includes Windows OCR when available)
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/download-artifact@v4
        with:
          name: PlayTranslateTV-apk
          path: playtranslate/server/static
      - name: Download OCR models
        run: python packaging/prepare_models.py
      - name: Build exe
        run: pyinstaller packaging/playtranslate.spec --noconfirm
      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PlayTranslate\PlayTranslate.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\PlayTranslate\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
      - name: Add guide and zip
        shell: pwsh
        run: |
          Copy-Item docs\INSTALL-ar.md dist\PlayTranslate\
          Copy-Item playtranslate\server\static\PlayTranslateTV.apk dist\PlayTranslate\
          Compress-Archive -Path dist\PlayTranslate -DestinationPath PlayTranslate-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PlayTranslate-windows
          path: PlayTranslate-windows.zip
      - name: Release (on version tags, or a manual run with release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PlayTranslate ${{ inputs.release_tag || github.ref_name }}
          body_path: docs/RELEASE-ar.md
          files: |
            PlayTranslate-windows.zip
            playtranslate/server/static/PlayTranslateTV.apk

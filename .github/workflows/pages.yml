name: Guide site

on:
  push:
    branches: [main]
    paths: ["docs/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs: when deploy-pages runs in the same job a fraction of a
  # second after the upload, it sometimes lists 0 artifacts and fails ("No artifacts named
  # github-pages"). The job boundary gives the artifact time to be listed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Needs Settings -> Pages -> Source: GitHub Actions (once, by the repository owner).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
